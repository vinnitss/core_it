services:
  db:
    image: postgres:15
    container_name: report_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # опционально для внешнего доступа
    networks:
      - report_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: report_app
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/app.log
      - SLOW_QUERY_THRESHOLD=3.0
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - report_network
    volumes:
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./modules:/app/modules
      - ./templates:/app/templates
      - ./static:/app/static
      - ./logs:/app/logs
      - ./docs:/app/docs
    command: gunicorn -w 4 -b 0.0.0.0:5000 --timeout 600 app:app

networks:
  report_network:
    driver: bridge

volumes:
  pg_data:
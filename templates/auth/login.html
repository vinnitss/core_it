<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — АО «Стройтранснефтегаз»</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            background: linear-gradient(135deg, #1a2634 0%, #0d6efd22 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-logo {
            width: 70px;
            height: 70px;
            background: #1a2634;
            color: #fff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 auto 18px;
        }
        .login-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a2634;
            margin-bottom: 4px;
        }
        .login-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        .btn-login {
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            background: #0d6efd;
            border: none;
        }
        .btn-login:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">СТНГ</div>
        <div class="login-title">АО «Стройтранснефтегаз»</div>
        <div class="login-subtitle">Корпоративный портал заявок и договоров</div>

        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-bold small">Email</label>
                <input type="email" name="email" class="form-control" required autofocus
                       placeholder="user@stng.ru" autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">Пароль</label>
                <input type="password" name="password" class="form-control" required
                       placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="fas fa-sign-in-alt me-2"></i>Войти
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
